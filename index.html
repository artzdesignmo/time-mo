<!DOCTYPE html>
<html lang="en" data-theme="silver">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Time Mo — Falling-Sand Countdown</title>
<meta name="description" content="Time Mo: a falling-sand visual countdown timer. Sand falls as time passes; the pile completes when the timer ends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dela:'Dela Gothic One', 'Noto Sans TC', sans-serif;
    --body:'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif;
  }
  [data-theme="silver"]{ --bg:#e9e9e7; --bg2:#dfdfdc; --ink:#191917; --ink2:#5c5c58; --card:#f5f5f3; --card2:#efefec; --line:rgba(25,25,23,.14); --line2:rgba(25,25,23,.08); --accent:#b3541e; --stage:#14110e; --shadow:0 18px 50px rgba(25,25,23,.14); }
  [data-theme="white"]{ --bg:#fafafa; --bg2:#f0f0f0; --ink:#161616; --ink2:#6a6a6a; --card:#ffffff; --card2:#f6f6f6; --line:rgba(22,22,22,.14); --line2:rgba(22,22,22,.08); --accent:#b3541e; --stage:#14110e; --shadow:0 18px 50px rgba(22,22,22,.12); }
  [data-theme="black"]{ --bg:#101010; --bg2:#181818; --ink:#f2f2f0; --ink2:#a8a8a4; --card:#1c1c1c; --card2:#232323; --line:rgba(242,242,240,.16); --line2:rgba(242,242,240,.08); --accent:#e08a3c; --stage:#0a0908; --shadow:0 18px 50px rgba(0,0,0,.5); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--body); font-weight:400; min-height:100vh; display:flex; flex-direction:column; transition:background .3s, color .3s; }
  /* ---------- header ---------- */
  header{ position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line2); }
  .brand{ font-family:var(--dela); font-size:22px; letter-spacing:.5px; cursor:pointer; user-select:none; }
  .brand small{ font-family:var(--body); font-weight:300; font-size:11px; letter-spacing:2.5px; color:var(--ink2); display:block; margin-top:2px; }
  .hctl{ display:flex; align-items:center; gap:10px; }
  .lang{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; font-size:12px; font-weight:500; }
  .lang button{ border:0; background:transparent; color:var(--ink2); padding:7px 12px; cursor:pointer; font-family:var(--body); font-size:12px; font-weight:500; }
  .lang button.on{ background:var(--ink); color:var(--bg); }
  .themes{ display:flex; gap:7px; align-items:center; margin-left:2px; }
  .tdot{ width:22px; height:22px; border-radius:50%; border:1px solid var(--line); cursor:pointer; padding:0; }
  .tdot[data-t="white"]{ background:#fafafa; } .tdot[data-t="silver"]{ background:#d7d7d3; } .tdot[data-t="black"]{ background:#111; }
  .tdot.on{ outline:2px solid var(--accent); outline-offset:2px; }
  /* ---------- layout ---------- */
  main{ flex:1; width:100%; max-width:640px; margin:0 auto; padding:26px 20px 60px; }
  .screen{ display:none; animation:fadeUp .35s ease; }
  .screen.on{ display:block; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
  h1{ font-family:var(--dela); font-size:30px; line-height:1.25; margin-bottom:6px; }
  .lede{ color:var(--ink2); font-size:14px; font-weight:300; letter-spacing:.4px; margin-bottom:26px; }
  .sect{ margin-bottom:28px; }
  .sect > h3{ font-size:11px; font-weight:500; letter-spacing:3px; text-transform:uppercase; color:var(--ink2); margin-bottom:12px; }
  /* ---------- menu cards ---------- */
  .modes{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:440px){ .modes{ grid-template-columns:1fr; } }
  .mode{ background:var(--card); border:1px solid var(--line2); border-radius:18px; padding:22px 18px; cursor:pointer; transition:transform .18s, box-shadow .18s, border-color .18s; text-align:left; color:var(--ink); font-family:var(--body); box-shadow:0 2px 10px rgba(0,0,0,.03); }
  .mode:hover{ transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--line); }
  .mode svg{ width:44px; height:44px; margin-bottom:12px; display:block; }
  .mode b{ font-family:var(--dela); font-size:17px; font-weight:400; display:block; margin-bottom:6px; }
  .mode span{ font-size:12.5px; color:var(--ink2); font-weight:300; line-height:1.5; display:block; }
  /* ---------- option grids ---------- */
  .opts{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .opts.t6{ grid-template-columns:repeat(6,1fr); }
  .opts.t5{ grid-template-columns:repeat(5,1fr); }
  @media (max-width:440px){ .opts.t6{ grid-template-columns:repeat(3,1fr);} .opts.t5{ grid-template-columns:repeat(5,1fr);} }
  .opt{ background:var(--card); border:1.5px solid var(--line2); border-radius:14px; padding:12px 6px; cursor:pointer; text-align:center; color:var(--ink); font-family:var(--body); transition:border-color .15s, transform .15s; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .opt:hover{ border-color:var(--line); }
  .opt.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .opt svg{ width:30px; height:30px; }
  .opt em{ font-style:normal; font-size:11px; font-weight:500; letter-spacing:.3px; }
  .opt .sw{ width:26px; height:26px; border-radius:50%; border:1px solid var(--line); }
  .opt .tm{ font-family:var(--dela); font-size:15px; }
  .opt .tm small{ font-family:var(--body); font-size:10px; color:var(--ink2); font-weight:400; }
  .txtin{ width:100%; background:var(--card); border:1.5px solid var(--line2); border-radius:14px; padding:16px; font-family:var(--dela); font-size:24px; color:var(--ink); text-align:center; letter-spacing:4px; text-transform:uppercase; outline:none; }
  .txtin:focus{ border-color:var(--accent); }
  .numrow{ display:flex; gap:10px; align-items:center; }
  .numin{ flex:1; background:var(--card); border:1.5px solid var(--line2); border-radius:14px; padding:13px 16px; font-family:var(--body); font-size:16px; color:var(--ink); outline:none; width:100%; }
  .numin:focus{ border-color:var(--accent); }
  /* ---------- buttons ---------- */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:999px; padding:15px 34px; font-family:var(--body); font-size:15px; font-weight:500; letter-spacing:1px; cursor:pointer; transition:transform .15s, opacity .15s; }
  .btn:active{ transform:scale(.97); }
  .btn.pri{ background:var(--ink); color:var(--bg); }
  .btn.sec{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btnrow{ display:flex; gap:10px; margin-top:26px; }
  .btnrow .btn{ flex:1; }
  .backlink{ display:inline-block; margin-top:18px; background:none; border:0; color:var(--ink2); font-size:13px; cursor:pointer; font-family:var(--body); letter-spacing:.5px; }
  .backlink:hover{ color:var(--ink); }
  /* ---------- running ---------- */
  .runhead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .runhead .mlabel{ font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--ink2); font-weight:500; }
  .clock{ font-family:var(--dela); font-size:40px; letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .stage{ position:relative; border-radius:22px; overflow:hidden; background:var(--stage); box-shadow:var(--shadow); border:1px solid var(--line2); }
  .stage canvas{ display:block; width:100%; height:auto; touch-action:none; }
  .prog{ height:5px; background:var(--line2); border-radius:99px; margin:16px 0 4px; overflow:hidden; }
  .prog i{ display:block; height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .3s linear; }
  .runctl{ display:flex; gap:10px; margin-top:18px; }
  .runctl .btn{ flex:1; padding:13px 10px; font-size:14px; }
  /* ---------- done ---------- */
  .donecard{ background:var(--card); border:1px solid var(--line2); border-radius:22px; padding:44px 28px; text-align:center; box-shadow:var(--shadow); }
  .donecard .big{ font-family:var(--dela); font-size:34px; margin-bottom:10px; }
  .donecard p{ color:var(--ink2); font-size:14px; font-weight:300; margin-bottom:26px; }
  .donecard svg{ width:74px; height:74px; margin-bottom:18px; }
  footer{ text-align:center; padding:26px 16px 40px; color:var(--ink2); font-size:11.5px; letter-spacing:1.5px; font-weight:300; }
  footer a{ color:var(--ink2); }
</style>
</head>
<body>
<header>
  <div class="brand" id="brandHome">TIME MO<small id="brandSub">FALLING-SAND TIMER</small></div>
  <div class="hctl">
    <div class="lang" role="group" aria-label="language">
      <button id="langEn" class="on">EN</button><button id="langZh">中</button>
    </div>
    <div class="themes" role="group" aria-label="theme">
      <button class="tdot" data-t="white" aria-label="white"></button><button class="tdot on" data-t="silver" aria-label="silver"></button><button class="tdot" data-t="black" aria-label="black"></button>
    </div>
  </div>
</header>
<main>
  <!-- MENU -->
  <section class="screen on" id="scr-menu">
    <h1 data-i="menu_h">What are we timing?</h1>
    <p class="lede" data-i="menu_l">Sand falls as time passes. When the pile is full, time is up.</p>
    <div class="modes" id="modeGrid"></div>
  </section>
  <!-- SETUP -->
  <section class="screen" id="scr-setup">
    <h1 id="setupTitle">Shape</h1>
    <p class="lede" id="setupLede"></p>
    <div id="setupBody"></div>
    <div class="btnrow">
      <button class="btn sec" id="btnSetupBack" data-i="back">Back</button>
      <button class="btn pri" id="btnStart" data-i="start">Start</button>
    </div>
  </section>
  <!-- RUNNING -->
  <section class="screen" id="scr-run">
    <div class="runhead">
      <div class="mlabel" id="runMode">POMODORO</div>
      <div class="clock" id="clock">10:00</div>
    </div>
    <div class="stage"><canvas id="stage"></canvas></div>
    <div class="prog"><i id="progBar"></i></div>
    <div class="runctl">
      <button class="btn sec" id="btnPause" data-i="pause">Pause</button>
      <button class="btn sec" id="btnReset" data-i="reset">Reset</button>
    </div>
  </section>
  <!-- DONE -->
  <section class="screen" id="scr-done">
    <div class="donecard">
      <svg viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="34" stroke="currentColor" stroke-width="3" opacity=".25"/><path d="M26 41l10 10 18-20" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="big" data-i="done_h">Complete</div>
      <p data-i="done_l">The pile is full. Well done.</p>
      <div class="btnrow" style="margin-top:0">
        <button class="btn sec" id="btnAgain" data-i="again">Again</button>
        <button class="btn pri" id="btnNew" data-i="newt">New timer</button>
      </div>
    </div>
  </section>
</main>
<footer>TIME MO · <span data-i="foot">an open-source falling-sand timer</span> · <a href="https://buymeacoffee.com/whynotartmoney" target="_blank" rel="noopener">Buy Me a Coffee</a></footer>
<script>
"use strict";
/* ================= i18n ================= */
const I18N = {
en:{
  menu_h:"What are we timing?", menu_l:"Sand falls as time passes. When the pile is full, time is up.",
  m_shape:"Shape", m_shape_d:"Sand falls into a geometric form",
  m_letter:"Letter", m_letter_d:"Sand spells out your words",
  m_pomo:"Pomodoro", m_pomo_d:"Focus timer — the pile grows as you work",
  m_stop:"Stopwatch", m_stop_d:"Count up while the sand keeps falling",
  s_shape:"Shape timer", s_letter:"Letter timer", s_pomo:"Pomodoro", s_stop:"Stopwatch",
  s_shape_l:"Pick a form for the sand to build.",
  s_letter_l:"Type up to 8 characters for the sand to spell.",
  s_pomo_l:"A focus session, measured in sand.",
  s_stop_l:"Open-ended timing, measured in sand.",
  shape:"Shape", material:"Material", color:"Color", duration:"Duration", text:"Your text",
  text_ph:"TYPE HERE", custom_min:"Custom minutes",
  start:"Start", pause:"Pause", resume:"Resume", reset:"Reset", back:"Back",
  min_u:"min", done_h:"Complete", done_l:"The pile is full. Well done.",
  again:"Again", newt:"New timer", foot:"an open-source falling-sand timer",
  brand_sub:"FALLING-SAND TIMER", paused:"Paused",
  shapes:{circle:"Circle",square:"Square",triangle:"Triangle",diamond:"Diamond",hexagon:"Hexagon",rect:"Rect"},
  mats:{fire:"Fire",water:"Water",stone:"Stone",gold:"Gold",wood:"Wood"},
  cols:{gold:"Gold",ember:"Ember",leaf:"Leaf",ocean:"Ocean",violet:"Violet",rose:"Rose"},
},
zh:{
  menu_h:"今次計咩時？", menu_l:"沙隨時間掉落，堆滿一刻即係時間到。",
  m_shape:"圖形", m_shape_d:"沙粒掉落砌出幾何圖形",
  m_letter:"文字", m_letter_d:"沙粒砌出你打嘅字",
  m_pomo:"番茄鐘", m_pomo_d:"專注計時，沙堆隨你愈堆愈高",
  m_stop:"秒錶", m_stop_d:"正向計時，沙一直落",
  s_shape:"圖形計時", s_letter:"文字計時", s_pomo:"番茄鐘", s_stop:"秒錶",
  s_shape_l:"揀一個圖形，等沙砌出嚟。",
  s_letter_l:"最多打 8 個字，等沙砌出嚟。",
  s_pomo_l:"一段專注時間，用沙嚟量。",
  s_stop_l:"開放式計時，用沙嚟量。",
  shape:"圖形", material:"物料", color:"顏色", duration:"時長", text:"文字",
  text_ph:"打字", custom_min:"自定分鐘",
  start:"開始", pause:"暫停", resume:"繼續", reset:"重設", back:"返回",
  min_u:"分鐘", done_h:"完成", done_l:"沙堆滿喇，做得好。",
  again:"再嚟", newt:"新計時", foot:"開源落沙計時器",
  brand_sub:"落沙計時器", paused:"已暫停",
  shapes:{circle:"圓形",square:"正方形",triangle:"三角形",diamond:"菱形",hexagon:"六角形",rect:"長方形"},
  mats:{fire:"火",water:"水",stone:"石",gold:"金",wood:"木"},
  cols:{gold:"金",ember:"赭紅",leaf:"葉綠",ocean:"海藍",violet:"紫",rose:"玫紅"},
}};
let lang = localStorage.getItem('timemo-lang') || 'en';
let theme = localStorage.getItem('timemo-theme') || 'silver';
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

/* ================= data ================= */
const PALETTES = [
  {id:'gold',   c:['#a8842c','#e0b64f','#f6dd9a']},
  {id:'ember',  c:['#a04a34','#d4694f','#f0a58c']},
  {id:'leaf',   c:['#2f7d52','#55ad7d','#9adcb8']},
  {id:'ocean',  c:['#256a94','#4d9fd1','#9ccfee']},
  {id:'violet', c:['#5b4a9e','#7f6cc4','#b7a9e8']},
  {id:'rose',   c:['#9e3a5e','#c65f83','#eba9c2']},
];
const MATERIALS = [
  {id:'fire',  grav:1.18, sway:0.55, fx:'glow'},
  {id:'water', grav:0.82, sway:1.70, fx:'splash'},
  {id:'stone', grav:1.32, sway:0.22, fx:'thud'},
  {id:'gold',  grav:1.00, sway:0.70, fx:'spark'},
  {id:'wood',  grav:0.94, sway:0.95, fx:'spin'},
];
const SHAPES = ['circle','square','triangle','diamond','hexagon','rect'];
const TIMES = [1,5,10,20,30,60];
const POMO_PRESETS = [10,20,30];

function shapeSVG(s, ink){
  ink = ink || 'currentColor';
  const p = 'fill="none" stroke="'+ink+'" stroke-width="3"';
  switch(s){
    case 'circle': return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" '+p+'/></svg>';
    case 'square': return '<svg viewBox="0 0 40 40"><rect x="8" y="8" width="24" height="24" '+p+'/></svg>';
    case 'triangle': return '<svg viewBox="0 0 40 40"><path d="M20 7 L33 31 H7 Z" '+p+'/></svg>';
    case 'diamond': return '<svg viewBox="0 0 40 40"><path d="M20 5 L33 20 L20 35 L7 20 Z" '+p+'/></svg>';
    case 'hexagon': return '<svg viewBox="0 0 40 40"><path d="M20 5 L32 12.5 V27.5 L20 35 L8 27.5 V12.5 Z" '+p+'/></svg>';
    default: return '<svg viewBox="0 0 40 40"><rect x="6" y="12" width="28" height="16" rx="2" '+p+'/></svg>';
  }
}
function matSVG(m, c){
  c = c || 'currentColor';
  switch(m){
    case 'fire': return '<svg viewBox="0 0 40 40"><path d="M20 4 C24 12 30 15 30 24 a10 10 0 0 1 -20 0 C10 15 16 12 20 4 Z" fill="'+c+'"/></svg>';
    case 'water': return '<svg viewBox="0 0 40 40"><path d="M20 5 C20 5 10 20 10 27 a10 10 0 0 0 20 0 C30 20 20 5 20 5 Z" fill="'+c+'"/></svg>';
    case 'stone': return '<svg viewBox="0 0 40 40"><path d="M8 28 L14 12 L26 10 L33 24 L24 32 Z" fill="'+c+'"/></svg>';
    case 'gold': return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="'+c+'"/><circle cx="20" cy="20" r="7" fill="none" stroke="#14110e" stroke-width="2.5"/></svg>';
    default: return '<svg viewBox="0 0 40 40"><rect x="9" y="9" width="22" height="22" rx="4" fill="'+c+'" transform="rotate(18 20 20)"/></svg>';
  }
}
function modeSVG(m){
  const s = 'fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"';
  if(m==='shape') return '<svg viewBox="0 0 48 48"><circle cx="24" cy="20" r="11" '+s+'/><path d="M24 36v8M18 40h12" '+s+'/></svg>';
  if(m==='letter') return '<svg viewBox="0 0 48 48"><path d="M12 36V12h20M12 24h14" '+s+'/></svg>';
  if(m==='pomo') return '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" '+s+'/><path d="M24 16v8l6 4" '+s+'/></svg>';
  return '<svg viewBox="0 0 48 48"><path d="M18 8h12M24 8v8" '+s+'/><circle cx="24" cy="27" r="13" '+s+'/><path d="M24 21v6l4 3" '+s+'/></svg>';
}

/* ================= shell: theme + lang ================= */
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('.tdot').forEach(b=>b.classList.toggle('on', b.dataset.t===theme));
  localStorage.setItem('timemo-theme', theme);
}
function applyLang(){
  document.documentElement.lang = lang==='zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = t(el.dataset.i); });
  document.getElementById('langEn').classList.toggle('on', lang==='en');
  document.getElementById('langZh').classList.toggle('on', lang==='zh');
  document.getElementById('brandSub').textContent = t('brand_sub');
  localStorage.setItem('timemo-lang', lang);
  buildMenu();
  if(S.phase==='setup') buildSetup();
  if(S.phase==='running'||S.phase==='paused') drawRunHead();
}
document.getElementById('langEn').onclick = ()=>{ lang='en'; applyLang(); };
document.getElementById('langZh').onclick = ()=>{ lang='zh'; applyLang(); };
document.querySelectorAll('.tdot').forEach(b=> b.onclick = ()=>{ theme=b.dataset.t; applyTheme(); });
document.getElementById('brandHome').onclick = ()=> show('menu');

/* ================= state ================= */
const S = {
  phase:'menu', mode:null,
  shape:0, material:3, color:0, text:'TIME',
  minutes:10, customMin:'',
};
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('scr-'+id).classList.add('on');
  S.phase = id;
  window.scrollTo({top:0});
}

/* ================= menu ================= */
function buildMenu(){
  const modes = [
    {id:'shape', icon:modeSVG('shape'), h:t('m_shape'), d:t('m_shape_d')},
    {id:'letter', icon:modeSVG('letter'), h:t('m_letter'), d:t('m_letter_d')},
    {id:'pomo', icon:modeSVG('pomo'), h:t('m_pomo'), d:t('m_pomo_d')},
    {id:'stop', icon:modeSVG('stop'), h:t('m_stop'), d:t('m_stop_d')},
  ];
  const g = document.getElementById('modeGrid');
  g.innerHTML = '';
  modes.forEach(m=>{
    const b = document.createElement('button');
    b.className = 'mode';
    b.innerHTML = m.icon + '<b>'+m.h+'</b><span>'+m.d+'</span>';
    b.onclick = ()=>{ S.mode = m.id; buildSetup(); show('setup'); };
    g.appendChild(b);
  });
}

/* ================= setup ================= */
function sect(title){
  const d = document.createElement('div');
  d.className = 'sect';
  d.innerHTML = '<h3>'+title+'</h3>';
  return d;
}
function optGrid(cls){
  const d = document.createElement('div');
  d.className = 'opts '+cls;
  return d;
}
function pickOpt(grid, idx, group){
  grid.querySelectorAll('.opt').forEach((o,i)=>o.classList.toggle('on', i===idx));
}
function buildSetup(){
  const body = document.getElementById('setupBody');
  body.innerHTML = '';
  const titles = {shape:'s_shape', letter:'s_letter', pomo:'s_pomo', stop:'s_stop'};
  const ledes = {shape:'s_shape_l', letter:'s_letter_l', pomo:'s_pomo_l', stop:'s_stop_l'};
  document.getElementById('setupTitle').textContent = t(titles[S.mode]);
  document.getElementById('setupLede').textContent = t(ledes[S.mode]);

  if(S.mode==='shape'){
    const s = sect(t('shape')), g = optGrid('t6');
    SHAPES.forEach((sh,i)=>{
      const b = document.createElement('button');
      b.className = 'opt'+(i===S.shape?' on':'');
      b.innerHTML = shapeSVG(sh)+'<em>'+t('shapes')[sh]+'</em>';
      b.onclick = ()=>{ S.shape=i; pickOpt(g,i); };
      g.appendChild(b);
    });
    s.appendChild(g); body.appendChild(s);
  }
  if(S.mode==='letter'){
    const s = sect(t('text'));
    const inp = document.createElement('input');
    inp.className = 'txtin'; inp.maxLength = 8; inp.value = S.text;
    inp.placeholder = t('text_ph'); inp.spellcheck = false;
    inp.oninput = ()=>{ S.text = inp.value.toUpperCase().slice(0,8) || 'TIME'; };
    s.appendChild(inp); body.appendChild(s);
  }

  const ms = sect(t('material')), mg = optGrid('t5');
  MATERIALS.forEach((m,i)=>{
    const b = document.createElement('button');
    b.className = 'opt'+(i===S.material?' on':'');
    b.innerHTML = matSVG(m.id)+'<em>'+t('mats')[m.id]+'</em>';
    b.onclick = ()=>{ S.material=i; pickOpt(mg,i); };
    mg.appendChild(b);
  });
  ms.appendChild(mg); body.appendChild(ms);

  const cs = sect(t('color')), cg = optGrid('t6');
  PALETTES.forEach((p,i)=>{
    const b = document.createElement('button');
    b.className = 'opt'+(i===S.color?' on':'');
    b.innerHTML = '<span class="sw" style="background:'+p.c[1]+'"></span><em>'+t('cols')[p.id]+'</em>';
    b.onclick = ()=>{ S.color=i; pickOpt(cg,i); };
    cg.appendChild(b);
  });
  cs.appendChild(cg); body.appendChild(cs);

  if(S.mode!=='stop'){
    const ts = sect(t('duration')), tg = optGrid('t6');
    const list = S.mode==='pomo' ? POMO_PRESETS : TIMES;
    list.forEach(mn=>{
      const b = document.createElement('button');
      b.className = 'opt'+(S.minutes===mn && !S.customMin ? ' on':'');
      b.innerHTML = '<span class="tm">'+mn+'<small> '+t('min_u')+'</small></span>';
      b.onclick = ()=>{ S.minutes=mn; S.customMin=''; syncTimeOpts(tg, list); };
      tg.appendChild(b);
    });
    ts.appendChild(tg);
    const nr = document.createElement('div');
    nr.className = 'numrow'; nr.style.marginTop = '10px';
    const ni = document.createElement('input');
    ni.className = 'numin'; ni.type = 'number'; ni.min = 1; ni.max = 180;
    ni.placeholder = t('custom_min'); ni.value = S.customMin;
    ni.oninput = ()=>{ const v = Math.max(1, Math.min(180, +ni.value||0)); if(v){ S.minutes=v; S.customMin=String(v); syncTimeOpts(tg, list);} };
    nr.appendChild(ni); ts.appendChild(nr);
    body.appendChild(ts);
  }
  function syncTimeOpts(tg, list){
    tg.querySelectorAll('.opt').forEach((o,i)=>o.classList.toggle('on', list[i]===S.minutes && !S.customMin));
  }
}
document.getElementById('btnSetupBack').onclick = ()=> show('menu');
document.getElementById('btnStart').onclick = ()=> startRun();

/* ================= engine ================= */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let DPR = 1, CW = 0, CH = 0;
const GRAV = 980; // px/s^2

const E = {
  running:false, paused:false, done:false,
  mode:'pile', grains:[], dust:[],
  heights:null, colW:6, cols:0,
  targets:[], relAcc:0, released:0, total:0, settled:0,
  elapsed:0, duration:0, last:0,
  mat:MATERIALS[3], pal:PALETTES[0],
  layer:null, lctx:null,
};

function sizeStage(){
  const w = canvas.clientWidth || 600;
  const h = Math.round(w * 4 / 3);
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  canvas.style.height = h + 'px';
  CW = w; CH = h;
  const layer = document.createElement('canvas');
  layer.width = canvas.width; layer.height = canvas.height;
  E.layer = layer; E.lctx = layer.getContext('2d');
  E.lctx.scale(DPR, DPR);
}
function shadeColor(i){
  const c = E.pal.c;
  const r = (i * 2654435761) % 100;
  return r < 62 ? c[1] : (r < 84 ? c[2] : c[0]);
}
function drawSettled(x, y, size, idx){
  const g = E.lctx;
  g.fillStyle = shadeColor(idx);
  if(E.mat.fx === 'spin'){
    g.save(); g.translate(x, y); g.rotate((idx * 0.7) % 1.2 - 0.6);
    g.fillRect(-size/2, -size/2, size, size*0.82); g.restore();
  } else {
    g.beginPath(); g.arc(x, y, size/2, 0, 6.2832); g.fill();
  }
  if(E.mat.fx === 'glow'){
    g.fillStyle = 'rgba(255,150,60,.18)';
    g.beginPath(); g.arc(x, y, size*1.1, 0, 6.2832); g.fill();
  }
}
function puff(x, y, n, col){
  for(let i=0;i<n;i++){
    E.dust.push({x:x, y:y, vx:(Math.random()-0.5)*70, vy:-Math.random()*60-10,
      life:0.5+Math.random()*0.3, age:0, col:col || 'rgba(255,255,255,.5)', r:1+Math.random()*2});
  }
}

/* ---- target sampling ---- */
function samplePoints(maskFn, step){
  const pts = [];
  for(let y=step/2; y<CH; y+=step)
    for(let x=step/2; x<CW; x+=step){
      const jx = x + (Math.random()-0.5)*step*0.5;
      const jy = y + (Math.random()-0.5)*step*0.5;
      if(maskFn(jx, jy)) pts.push({x:jx, y:jy});
    }
  for(let i=pts.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const tmp=pts[i]; pts[i]=pts[j]; pts[j]=tmp; }
  return pts;
}
function inShape(s, x, y){
  x = (x - CW/2) / (CW*0.36); y = (y - CH*0.44) / (CH*0.30);
  switch(s){
    case 'circle': return x*x + y*y <= 1;
    case 'square': return Math.abs(x) <= 0.9 && Math.abs(y) <= 0.9;
    case 'triangle': return y >= -0.9 && y <= 0.9*(1-Math.abs(x)/0.95) - 0.05;
    case 'diamond': return Math.abs(x)/1.0 + Math.abs(y)/0.95 <= 1;
    case 'hexagon': return Math.abs(x) <= 0.95 && Math.abs(y) <= 0.9 && Math.abs(x)*0.55 + Math.abs(y) <= 1.25;
    default: return Math.abs(x) <= 1.05 && Math.abs(y) <= 0.62;
  }
}
function sampleShapeTargets(){
  return samplePoints((x,y)=>inShape(SHAPES[S.shape], x, y), 8);
}
function sampleTextTargets(){
  const off = document.createElement('canvas');
  const scale = 3;
  off.width = CW*scale; off.height = CH*scale;
  const g = off.getContext('2d');
  g.scale(scale, scale);
  g.fillStyle = '#000'; g.fillRect(0, 0, CW, CH);
  const txt = (S.text || 'TIME').slice(0, 8);
  let fs = Math.min(150, CW / Math.max(1, txt.length) * 1.35);
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = fs + 'px "Dela Gothic One", sans-serif';
  while(g.measureText(txt).width > CW*0.86 && fs > 20){ fs -= 6; g.font = fs + 'px "Dela Gothic One", sans-serif'; }
  g.fillText(txt, CW/2, CH*0.44);
  const img = g.getImageData(0, 0, off.width, off.height).data;
  const step = 8, pts = [];
  for(let y=0; y<CH; y+=step) for(let x=0; x<CW; x+=step){
    const px = ((y*scale)|0) * off.width + ((x*scale)|0);
    if(img[px*4] > 128) pts.push({x:x+(Math.random()-0.5)*3, y:y+(Math.random()-0.5)*3});
  }
  for(let i=pts.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const tmp=pts[i]; pts[i]=pts[j]; pts[j]=tmp; }
  return pts;
}

/* ---- run control ---- */
function startRun(){
  sizeStage();
  E.mat = MATERIALS[S.material];
  E.pal = PALETTES[S.color];
  E.grains = []; E.dust = [];
  E.released = 0; E.settled = 0; E.relAcc = 0;
  E.elapsed = 0; E.done = false; E.paused = false;
  E.lctx.clearRect(0, 0, CW, CH);
  const isTargets = (S.mode === 'shape' || S.mode === 'letter');
  const doInit = ()=>{
    if(isTargets){
      E.mode = 'targets';
      E.targets = S.mode === 'shape' ? sampleShapeTargets() : sampleTextTargets();
      if(!E.targets.length) E.targets = [{x:CW/2, y:CH/2}];
      E.total = E.targets.length;
      E.duration = S.minutes * 60000;
    } else {
      E.mode = 'pile';
      E.colW = 6; E.cols = Math.ceil(CW / E.colW);
      E.heights = new Float32Array(E.cols);
      E.total = Math.floor(CW * CH * 0.82 / (E.colW * E.colW));
      E.duration = S.mode === 'pomo' ? S.minutes * 60000 : Infinity;
    }
    drawRunHead();
    show('run');
    E.running = true; E.last = performance.now();
    requestAnimationFrame(loop);
  };
  if(isTargets && S.mode === 'letter' && document.fonts && document.fonts.ready){
    document.fonts.ready.then(doInit);
  } else doInit();
}
function releaseRate(){
  if(E.mode === 'pile' && !isFinite(E.duration)) return 2.6; // stopwatch: grains/sec
  if(E.total <= 0 || !isFinite(E.duration) || E.duration <= 0) return 3;
  return E.total / (E.duration / 1000);
}
function spawnGrain(){
  const m = E.mat;
  if(E.mode === 'pile'){
    return { x: 8 + Math.random()*(CW-16), y: -12, vx:(Math.random()-0.5)*30,
      vy: 40 + Math.random()*40, size: 5 + Math.random()*3,
      ph: Math.random()*6.28, swayA: 14*m.sway, tx:-1, ty:-1, idx:E.released };
  }
  const tg = E.targets[E.released % E.targets.length];
  return { x: tg.x + (Math.random()-0.5)*10, y: -12, vx: 0,
    vy: 30 + Math.random()*30, size: 5.5 + Math.random()*2.5,
    ph: Math.random()*6.28, swayA: 8*m.sway, tx: tg.x, ty: tg.y, idx: E.released };
}
function settleGrain(gr){
  if(E.mode === 'pile'){
    const c = Math.max(0, Math.min(E.cols-1, Math.floor(gr.x / E.colW)));
    E.heights[c] += E.colW * 0.94;
    drawSettled(gr.x, CH - E.heights[c] + E.colW/2, gr.size, gr.idx);
  } else {
    drawSettled(gr.tx, gr.ty, gr.size, gr.idx);
  }
  E.settled++;
  if(E.mat.fx === 'splash') puff(gr.x, E.mode==='pile' ? CH - E.heights[Math.max(0,Math.min(E.cols-1,Math.floor(gr.x/E.colW)))] : gr.ty, 3, 'rgba(160,210,245,.55)');
  else if(E.mat.fx === 'spark') puff(gr.x, E.mode==='pile' ? CH : gr.ty, 2, 'rgba(255,220,120,.7)');
  else if(E.mat.fx === 'glow') puff(gr.x, E.mode==='pile' ? CH : gr.ty, 2, 'rgba(255,150,60,.4)');
}
function loop(now){
  if(!E.running) return;
  let dt = Math.min(0.05, (now - E.last) / 1000);
  E.last = now;
  if(!E.paused && !E.done){
    E.elapsed += dt * 1000;
    // release
    E.relAcc += releaseRate() * dt;
    let guard = 0;
    while(E.relAcc >= 1 && E.released < E.total && E.grains.length < 420 && guard++ < 60){
      E.relAcc -= 1; E.released++;
      E.grains.push(spawnGrain());
    }
    // physics
    const tsec = now / 1000, m = E.mat;
    for(let i = E.grains.length - 1; i >= 0; i--){
      const gr = E.grains[i];
      gr.vy += GRAV * m.grav * dt;
      gr.x += (gr.vx + Math.sin(tsec * 2.1 + gr.ph) * gr.swayA) * dt;
      gr.y += gr.vy * dt;
      let landed = false;
      if(E.mode === 'pile'){
        const c = Math.max(0, Math.min(E.cols-1, Math.floor(gr.x / E.colW)));
        if(gr.y >= CH - E.heights[c] - gr.size * 0.3) landed = true;
      } else if(gr.y >= gr.ty) landed = true;
      if(landed){ settleGrain(gr); E.grains.splice(i, 1); }
      else if(gr.y > CH + 30) E.grains.splice(i, 1);
    }
    // dust
    for(let i = E.dust.length - 1; i >= 0; i--){
      const d = E.dust[i];
      d.age += dt;
      if(d.age >= d.life){ E.dust.splice(i, 1); continue; }
      d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 160 * dt;
    }
    // completion
    let complete = false;
    if(isFinite(E.duration) && E.elapsed >= E.duration) complete = true;
    if(E.mode === 'pile' && E.settled >= E.total) complete = true;
    if(E.mode === 'targets' && E.settled >= E.total && E.grains.length === 0) complete = true;
    if(complete) finishRun();
    drawClock(); drawProg();
  }
  render();
  requestAnimationFrame(loop);
}
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, CW, CH);
  // backdrop vignette
  const vg = ctx.createRadialGradient(CW/2, CH*0.42, 40, CW/2, CH*0.5, CW*0.75);
  const st = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim() || '#14110e';
  ctx.fillStyle = st; ctx.fillRect(0, 0, CW, CH);
  ctx.fillStyle = 'rgba(255,255,255,.028)'; ctx.fillRect(0, 0, CW, CH);
  ctx.drawImage(E.layer, 0, 0, CW, CH);
  // falling grains with velocity stretch
  for(const gr of E.grains){
    const stretch = Math.min(1.1, gr.vy / 1100);
    const rx = gr.size * 0.5 * (1 + stretch * 0.9);
    const ry = gr.size * 0.5 * (1 - stretch * 0.35);
    ctx.fillStyle = shadeColor(gr.idx);
    ctx.beginPath(); ctx.ellipse(gr.x, gr.y, rx, ry, 0, 0, 6.2832); ctx.fill();
    if(E.mat.fx === 'glow'){
      ctx.fillStyle = 'rgba(255,150,60,.16)';
      ctx.beginPath(); ctx.arc(gr.x, gr.y, gr.size * 1.2, 0, 6.2832); ctx.fill();
    }
  }
  // dust
  for(const d of E.dust){
    const a = 1 - d.age / d.life;
    ctx.fillStyle = d.col.replace(/[\d.]+\)$/, a.toFixed(2) + ')');
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r * a + 0.4, 0, 6.2832); ctx.fill();
  }
  if(E.paused){
    ctx.fillStyle = 'rgba(10,9,8,.45)'; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = 'rgba(247,246,242,.92)';
    ctx.font = '400 15px "Noto Sans TC", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t('paused'), CW/2, CH/2);
  }
}
function fmt(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  const p = n => String(n).padStart(2, '0');
  return h > 0 ? h + ':' + p(m) + ':' + p(ss) : p(m) + ':' + p(ss);
}
function drawClock(){
  const el = document.getElementById('clock');
  el.textContent = isFinite(E.duration) ? fmt(E.duration - E.elapsed) : fmt(E.elapsed);
}
function drawProg(){
  let p = 0;
  if(isFinite(E.duration) && E.duration > 0) p = Math.min(1, E.elapsed / E.duration);
  else if(E.total > 0) p = E.settled / E.total;
  document.getElementById('progBar').style.width = (p * 100).toFixed(1) + '%';
}
function drawRunHead(){
  const names = {shape:t('s_shape'), letter:t('s_letter'), pomo:t('s_pomo'), stop:t('s_stop')};
  document.getElementById('runMode').textContent = (names[S.mode] || '').toUpperCase();
  drawClock(); drawProg();
  document.getElementById('btnPause').textContent = t(E.paused ? 'resume' : 'pause');
}
function finishRun(){
  E.done = true;
  setTimeout(()=>{ E.running = false; chime(); show('done'); }, 650);
}
/* chime: soft bell, 3 notes */
let AC = null;
function chime(){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = [659.25, 783.99, 1046.5];
    notes.forEach((f, i)=>{
      const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
      const t0 = AC.currentTime + i * 0.34;
      o.type = 'sine'; o.frequency.value = f;
      o2.type = 'sine'; o2.frequency.value = f * 2.01;
      const g2 = AC.createGain(); g2.gain.value = 0.25;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.5, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AC.destination);
      o.start(t0); o2.start(t0); o.stop(t0 + 1.7); o2.stop(t0 + 1.7);
    });
  }catch(e){}
}
document.getElementById('btnPause').onclick = ()=>{
  if(E.done) return;
  E.paused = !E.paused;
  document.getElementById('btnPause').textContent = t(E.paused ? 'resume' : 'pause');
};
document.getElementById('btnReset').onclick = ()=>{ E.running = false; buildSetup(); show('setup'); };
document.getElementById('btnAgain').onclick = ()=> startRun();
document.getElementById('btnNew').onclick = ()=>{ E.running = false; show('menu'); };
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && E.running && !E.paused && !E.done){
    E.paused = true;
    document.getElementById('btnPause').textContent = t('resume');
  }
});
window.addEventListener('resize', ()=>{ if(S.phase==='run'||S.phase==='running'||S.phase==='paused'){/* keep */} });

/* ================= boot ================= */
applyTheme();
applyLang();
buildMenu();
show('menu');
</script>
