<!DOCTYPE html>
<html lang="en" data-theme="silver">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Time Co — Full-Screen Sand Timer</title>
<meta name="description" content="Time Co: a full-screen falling-sand timer. Grains rain from above and pile until the screen fills exactly when time is up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --dela:'Dela Gothic One','Noto Sans TC',sans-serif; --body:'Noto Sans TC',-apple-system,'PingFang TC',sans-serif; }
  [data-theme="silver"]{ --bg:#e9e9e7; --ink:#191917; --ink2:#5c5c58; --card:#f5f5f3; --line:rgba(25,25,23,.14); --line2:rgba(25,25,23,.08); --accent:#b3541e; }
  [data-theme="white"]{ --bg:#fafafa; --ink:#161616; --ink2:#6a6a6a; --card:#ffffff; --line:rgba(22,22,22,.14); --line2:rgba(22,22,22,.08); --accent:#b3541e; }
  [data-theme="black"]{ --bg:#101010; --ink:#f2f2f0; --ink2:#a8a8a4; --card:#1c1c1c; --line:rgba(242,242,240,.16); --line2:rgba(242,242,240,.08); --accent:#e08a3c; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--body); transition:background .3s,color .3s; }
  /* ---------- setup ---------- */
  #setup{ min-height:100vh; display:flex; flex-direction:column; }
  #setup.hide{ display:none; }
  header{ position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line2); }
  .brand{ font-family:var(--dela); font-size:22px; letter-spacing:.5px; user-select:none; }
  .brand small{ font-family:var(--body); font-weight:300; font-size:10px; letter-spacing:3px; color:var(--ink2); display:block; margin-top:2px; }
  .hctl{ display:flex; align-items:center; gap:10px; }
  .lang{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .lang button{ border:0; background:transparent; color:var(--ink2); padding:7px 12px; cursor:pointer; font-family:var(--body); font-size:12px; font-weight:500; }
  .lang button.on{ background:var(--ink); color:var(--bg); }
  .themes{ display:flex; gap:7px; align-items:center; }
  .tdot{ width:22px; height:22px; border-radius:50%; border:1px solid var(--line); cursor:pointer; padding:0; }
  .tdot[data-t="white"]{ background:#fafafa; } .tdot[data-t="silver"]{ background:#d7d7d3; } .tdot[data-t="black"]{ background:#111; }
  .tdot.on{ outline:2px solid var(--accent); outline-offset:2px; }
  main{ flex:1; width:100%; max-width:620px; margin:0 auto; padding:30px 20px 60px; }
  h1{ font-family:var(--dela); font-size:34px; margin-bottom:6px; }
  .lede{ color:var(--ink2); font-size:14px; font-weight:300; letter-spacing:.4px; margin-bottom:30px; }
  .sect{ margin-bottom:26px; }
  .sect>h3{ font-size:11px; font-weight:500; letter-spacing:3px; text-transform:uppercase; color:var(--ink2); margin-bottom:12px; }
  .opts{ display:grid; gap:10px; grid-template-columns:repeat(5,1fr); }
  .opts.c6{ grid-template-columns:repeat(6,1fr); } .opts.c3{ grid-template-columns:repeat(3,1fr); }
  @media (max-width:440px){ .opts.c6{ grid-template-columns:repeat(3,1fr); } }
  .opt{ background:var(--card); border:1.5px solid var(--line2); border-radius:14px; padding:12px 6px; cursor:pointer; text-align:center; color:var(--ink); font-family:var(--body); min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; transition:border-color .15s; }
  .opt.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .opt svg{ width:30px; height:30px; }
  .opt em{ font-style:normal; font-size:11px; font-weight:500; }
  .opt .sw{ width:26px; height:26px; border-radius:50%; border:1px solid var(--line); }
  .opt .tm{ font-family:var(--dela); font-size:15px; } .opt .tm small{ font-family:var(--body); font-size:10px; color:var(--ink2); font-weight:400; }
  .numrow{ display:flex; gap:10px; margin-top:10px; }
  .numin{ flex:1; background:var(--card); border:1.5px solid var(--line2); border-radius:14px; padding:13px 16px; font-size:16px; color:var(--ink); outline:none; font-family:var(--body); width:100%; }
  .btn{ display:block; width:100%; border:0; border-radius:999px; padding:16px; font-size:16px; font-weight:500; letter-spacing:2px; cursor:pointer; background:var(--ink); color:var(--bg); font-family:var(--body); margin-top:30px; }
  .btn:active{ transform:scale(.98); }
  footer{ text-align:center; padding:24px; color:var(--ink2); font-size:11px; letter-spacing:1.5px; font-weight:300; }
  footer a{ color:var(--ink2); }
  /* ---------- stage ---------- */
  #stage{ position:fixed; inset:0; display:none; background:#0c0b09; z-index:100; }
  #stage.on{ display:block; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud{ position:absolute; z-index:5; pointer-events:none; }
  #clock{ top:max(14px, env(safe-area-inset-top)); left:20px; font-family:var(--dela); font-size:30px; color:#f5f3ee; text-shadow:0 2px 12px rgba(0,0,0,.6); font-variant-numeric:tabular-nums; }
  #pbar{ top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.12); }
  #pbar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#e08a3c,#f6dd9a); }
  .fbtns{ position:absolute; z-index:6; display:flex; gap:10px; }
  #topBtns{ top:max(14px, env(safe-area-inset-top)); right:16px; }
  #quickBtns{ bottom:max(20px, env(safe-area-inset-bottom)); right:16px; flex-direction:column; }
  .fbtn{ pointer-events:auto; width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.22); background:rgba(20,18,15,.55); color:#f5f3ee; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .fbtn:active{ transform:scale(.92); }
  .fbtn.on{ border-color:#e08a3c; color:#f6dd9a; }
  .fbtn svg{ width:20px; height:20px; }
  #toast{ position:absolute; z-index:6; bottom:max(24px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:rgba(20,18,15,.7); color:#f5f3ee; border:1px solid rgba(255,255,255,.16); padding:8px 18px; border-radius:999px; font-size:13px; letter-spacing:1px; opacity:0; transition:opacity .25s; pointer-events:none; backdrop-filter:blur(8px); }
  #toast.show{ opacity:1; }
  #timesup{ position:absolute; inset:0; z-index:7; display:none; align-items:center; justify-content:center; flex-direction:column; gap:18px; background:rgba(10,9,8,.45); backdrop-filter:blur(3px); }
  #timesup.on{ display:flex; animation:fadeUp .5s ease; }
  #timesup .big{ font-family:var(--dela); font-size:min(15vw,72px); color:#f7f5f0; text-shadow:0 4px 30px rgba(0,0,0,.7); letter-spacing:2px; }
  #timesup .btn{ width:auto; padding:14px 40px; margin-top:6px; background:#f5f3ee; color:#14110e; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none;} }
</style>
</head>
<body>
<div id="setup">
  <header>
    <div class="brand">TIME CO<small id="brandSub">SAND TIMER</small></div>
    <div class="hctl">
      <div class="lang"><button id="langEn" class="on">EN</button><button id="langZh">中</button></div>
      <div class="themes">
        <button class="tdot" data-t="white" aria-label="white"></button><button class="tdot on" data-t="silver" aria-label="silver"></button><button class="tdot" data-t="black" aria-label="black"></button>
      </div>
    </div>
  </header>
  <main>
    <h1 data-i="setup_h">Time Co</h1>
    <p class="lede" data-i="setup_l">Sand falls. Time passes. The screen fills when time is up.</p>
    <div class="sect"><h3 data-i="form">Grain form</h3><div class="opts" id="formGrid"></div></div>
    <div class="sect"><h3 data-i="time">Duration</h3><div class="opts c6" id="timeGrid"></div>
      <div class="numrow"><input class="numin" id="customMin" type="number" min="1" max="180"></div></div>
    <div class="sect"><h3 data-i="container">Container</h3><div class="opts c3" id="contGrid"></div></div>
    <div class="sect"><h3 data-i="csize">Container size</h3><div class="opts c3" id="sizeGrid"></div></div>
    <div class="sect"><h3 data-i="color">Color</h3><div class="opts c6" id="colorGrid"></div></div>
    <button class="btn" id="btnStart" data-i="start">Start</button>
  </main>
  <footer>TIME CO · <span data-i="foot">an open-source full-screen sand timer</span> · <a href="https://buymeacoffee.com/whynotartmoney" target="_blank" rel="noopener">Buy Me a Coffee</a></footer>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="pbar"><i id="pfill"></i></div>
  <div class="hud" id="clock">10:00</div>
  <div class="fbtns" id="topBtns">
    <button class="fbtn" id="bPause" aria-label="pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="fbtn" id="bClose" aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="fbtns" id="quickBtns">
    <button class="fbtn" id="bColor" aria-label="color"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg></button>
    <button class="fbtn" id="bShape" aria-label="shape"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4l7 12H5z"/></svg></button>
    <button class="fbtn" id="bGyro" aria-label="motion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5M20 12a8 8 0 0 1-14 5"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></button>
  </div>
  <div id="toast"></div>
  <div id="timesup"><div class="big" data-i="timesup">Times Up</div><button class="btn" id="bAgain" data-i="again">Again</button></div>
</div>
<script>
"use strict";
/* ================= i18n ================= */
const I18N = {
en:{
  setup_h:"Time Co", setup_l:"Sand falls. Time passes. The screen fills when time is up.",
  form:"Grain form", time:"Duration", container:"Container", csize:"Container size", color:"Color",
  start:"Start", timesup:"Times Up", again:"Again", foot:"an open-source full-screen sand timer",
  brand_sub:"SAND TIMER", custom_ph:"Custom minutes",
  forms:{circle:"Circle",square:"Square",triangle:"Triangle",diamond:"Diamond",hexagon:"Hexagon"},
  conts:{full:"Full screen",vessel:"Vessel",orb:"Orb"},
  sizes:{S:"S",M:"M",L:"L"},
  cols:{gold:"Gold",ember:"Ember",leaf:"Leaf",ocean:"Ocean",violet:"Violet",rose:"Rose"},
  min_u:"m", paused:"Paused",
  toast_color:"Color", toast_shape:"Shape", gyro_on:"Motion on", gyro_off:"Motion off", gyro_na:"Motion not available",
},
zh:{
  setup_h:"Time Co", setup_l:"沙落，時間過。沙填滿一刻即係時間到。",
  form:"沙粒形態", time:"時長", container:"容器", csize:"容器大小", color:"顏色",
  start:"開始", timesup:"時間到", again:"再嚟", foot:"開源全螢幕落沙計時器",
  brand_sub:"落沙計時器", custom_ph:"自定分鐘",
  forms:{circle:"圓形",square:"正方形",triangle:"三角形",diamond:"菱形",hexagon:"六角形"},
  conts:{full:"全螢幕",vessel:"器皿",orb:"圓球"},
  sizes:{S:"細",M:"中",L:"大"},
  cols:{gold:"金",ember:"赭紅",leaf:"葉綠",ocean:"海藍",violet:"紫",rose:"玫紅"},
  min_u:"分", paused:"已暫停",
  toast_color:"顏色", toast_shape:"形態", gyro_on:"動態開", gyro_off:"動態關", gyro_na:"唔支援動態",
}};
let lang = localStorage.getItem('timeco-lang') || 'en';
let theme = localStorage.getItem('timeco-theme') || 'silver';
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

/* ================= data ================= */
const PALETTES = [
  {id:'gold',   c:['#a8842c','#e0b64f','#f6dd9a']},
  {id:'ember',  c:['#a04a34','#d4694f','#f0a58c']},
  {id:'leaf',   c:['#2f7d52','#55ad7d','#9adcb8']},
  {id:'ocean',  c:['#256a94','#4d9fd1','#9ccfee']},
  {id:'violet', c:['#5b4a9e','#7f6cc4','#b7a9e8']},
  {id:'rose',   c:['#9e3a5e','#c65f83','#eba9c2']},
];
const FORMS = ['circle','square','triangle','diamond','hexagon'];
const TIMES = [1,5,10,15,30,60];
const CONTS = ['full','vessel','orb'];
const SIZES = ['S','M','L'];
const SIZE_F = {S:0.66, M:0.82, L:0.96};

function formSVG(f){
  const p = 'fill="none" stroke="currentColor" stroke-width="3"';
  if(f==='circle') return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" '+p+'/></svg>';
  if(f==='square') return '<svg viewBox="0 0 40 40"><rect x="9" y="9" width="22" height="22" rx="3" '+p+'/></svg>';
  if(f==='triangle') return '<svg viewBox="0 0 40 40"><path d="M20 8 L32 30 H8 Z" '+p+'/></svg>';
  if(f==='diamond') return '<svg viewBox="0 0 40 40"><path d="M20 6 L32 20 L20 34 L8 20 Z" '+p+'/></svg>';
  return '<svg viewBox="0 0 40 40"><path d="M20 6 L31 12.5 V27.5 L20 34 L9 27.5 V12.5 Z" '+p+'/></svg>';
}
function contSVG(c){
  const p = 'fill="none" stroke="currentColor" stroke-width="2.6"';
  if(c==='full') return '<svg viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" rx="2" '+p+'/></svg>';
  if(c==='vessel') return '<svg viewBox="0 0 40 40"><path d="M10 8 h20 v14 c0 8-5 12-10 12 s-10-4-10-12 Z" '+p+'/></svg>';
  return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" '+p+'/></svg>';
}

/* ================= state ================= */
const S = { form:0, minutes:10, custom:'', cont:'full', size:'M', color:0 };

/* ================= shell ================= */
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('.tdot').forEach(b=>b.classList.toggle('on', b.dataset.t===theme));
  localStorage.setItem('timeco-theme', theme);
}
function applyLang(){
  document.documentElement.lang = lang==='zh' ? 'zh-Hant' : 'en';
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = t(el.dataset.i); });
  document.getElementById('langEn').classList.toggle('on', lang==='en');
  document.getElementById('langZh').classList.toggle('on', lang==='zh');
  document.getElementById('brandSub').textContent = t('brand_sub');
  document.getElementById('customMin').placeholder = t('custom_ph');
  localStorage.setItem('timeco-lang', lang);
  buildSetup();
}
document.getElementById('langEn').onclick = ()=>{ lang='en'; applyLang(); };
document.getElementById('langZh').onclick = ()=>{ lang='zh'; applyLang(); };
document.querySelectorAll('.tdot').forEach(b=> b.onclick = ()=>{ theme=b.dataset.t; applyTheme(); });

/* ================= setup ================= */
function optRow(grid, items, cur, cb, inner){
  grid.innerHTML = '';
  items.forEach((it, i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (i===cur ? ' on' : '');
    b.innerHTML = inner(it, i);
    b.onclick = ()=>{ cb(i); grid.querySelectorAll('.opt').forEach((o,j)=>o.classList.toggle('on', j===i)); };
    grid.appendChild(b);
  });
}
function buildSetup(){
  optRow(document.getElementById('formGrid'), FORMS, S.form, i=>S.form=i,
    (f)=> formSVG(f) + '<em>'+t('forms')[f]+'</em>');
  const tg = document.getElementById('timeGrid');
  optRow(tg, TIMES, TIMES.indexOf(S.minutes), i=>{ S.minutes=TIMES[i]; S.custom=''; document.getElementById('customMin').value=''; },
    (m)=> '<span class="tm">'+m+'<small> '+t('min_u')+'</small></span>');
  if(!TIMES.includes(S.minutes)) tg.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
  optRow(document.getElementById('contGrid'), CONTS, CONTS.indexOf(S.cont), i=>S.cont=CONTS[i],
    (c)=> contSVG(c) + '<em>'+t('conts')[c]+'</em>');
  optRow(document.getElementById('sizeGrid'), SIZES, SIZES.indexOf(S.size), i=>S.size=SIZES[i],
    (s)=> '<span class="tm">'+t('sizes')[s]+'</span>');
  optRow(document.getElementById('colorGrid'), PALETTES, S.color, i=>S.color=i,
    (p)=> '<span class="sw" style="background:'+p.c[1]+'"></span><em>'+t('cols')[p.id]+'</em>');
}
document.getElementById('customMin').oninput = (e)=>{
  const v = Math.max(1, Math.min(180, +e.target.value || 0));
  if(v){ S.minutes=v; S.custom=String(v);
    document.getElementById('timeGrid').querySelectorAll('.opt').forEach(o=>o.classList.remove('on')); }
};
document.getElementById('btnStart').onclick = ()=> startRun();
/* ================= engine ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const GRAV = 1100;
let DPR=1, W=0, H=0;

const E = {
  running:false, paused:false, done:false,
  grains:[], dust:[], heights:null, cols:0, colW:6,
  cont:'full', sizeF:0.82, pal:PALETTES[0], form:'circle',
  released:0, total:0, relAcc:0, elapsed:0, duration:0, last:0,
  layer:null, lctx:null, gx:0, gy:GRAV,
  shakeX:0, shakeY:0,
};

function sizeCanvas(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  const layer = document.createElement('canvas');
  layer.width = cv.width; layer.height = cv.height;
  E.layer = layer; E.lctx = layer.getContext('2d');
  E.lctx.scale(DPR, DPR);
}
/* container: path + physics bbox */
function contPath(){
  const p = new Path2D();
  if(E.cont==='vessel'){
    const w = W*E.sizeF, h = H*E.sizeF, x = (W-w)/2, y = (H-h)/2, r = 30;
    p.roundRect ? p.roundRect(x, y, w, h, r) : p.rect(x, y, w, h);
    return {path:p, x0:x, x1:x+w};
  }
  if(E.cont==='orb'){
    const r = Math.min(W,H)*E.sizeF/2;
    p.arc(W/2, H/2, r, 0, 6.2832);
    return {path:p, x0:W/2-r, x1:W/2+r};
  }
  p.rect(0, 0, W, H);
  return {path:p, x0:0, x1:W};
}
function shade(i){
  const c = E.pal.c, r = (i*2654435761)%100;
  return r<62 ? c[1] : (r<84 ? c[2] : c[0]);
}
function grainPath(g, form, r){
  g.beginPath();
  if(form==='circle') g.arc(0,0,r,0,6.2832);
  else if(form==='square'){ const s=r*0.92; g.rect(-s,-s,s*2,s*2); }
  else if(form==='triangle'){ g.moveTo(0,-r); g.lineTo(r*0.95,r*0.82); g.lineTo(-r*0.95,r*0.82); g.closePath(); }
  else if(form==='diamond'){ g.moveTo(0,-r); g.lineTo(r*0.88,0); g.lineTo(0,r); g.lineTo(-r*0.88,0); g.closePath(); }
  else { for(let i=0;i<6;i++){ const a=Math.PI/3*i-Math.PI/6, px=Math.cos(a)*r, py=Math.sin(a)*r; if(i) g.lineTo(px,py); else g.moveTo(px,py); } g.closePath(); }
}
function spawn(){
  const {x0, x1} = contPath();
  const size = 4.5 + Math.random()*3;
  return {
    x: x0 + 6 + Math.random()*Math.max(10,(x1-x0-12)), y: -12 - Math.random()*40,
    vx:(Math.random()-0.5)*36, vy: 20+Math.random()*40,
    size, rot: Math.random()*6.28, vr:(Math.random()-0.5)*3,
    ph: Math.random()*6.28, form: E.form, idx: E.released,
    shade: shade(E.released),
  };
}
function settle(gr){
  const c = Math.max(0, Math.min(E.cols-1, Math.floor(gr.x / W * E.cols)));
  E.heights[c] += E.colW * 0.92;
  const g = E.lctx, r = gr.size/2;
  g.save(); g.translate(gr.x, H - E.heights[c] + E.colW/2); g.rotate(gr.rot);
  grainPath(g, gr.form, r); g.fillStyle = gr.shade; g.fill();
  g.restore();
  E.settledCount++;
  if(E.dust.length < 120 && Math.random() < 0.3)
    E.dust.push({x:gr.x, y:H-E.heights[c], vx:(Math.random()-0.5)*60, vy:-Math.random()*50,
      age:0, life:0.4+Math.random()*0.3, r:0.8+Math.random()*1.6});
}
function startRun(){
  sizeCanvas();
  E.cont = S.cont; E.sizeF = SIZE_F[S.size];
  E.pal = PALETTES[S.color]; E.form = FORMS[S.form];
  E.grains=[]; E.dust=[]; E.released=0; E.settledCount=0; E.relAcc=0;
  E.elapsed=0; E.done=false; E.paused=false; E.gx=0; E.gy=GRAV; E.shakeX=0; E.shakeY=0;
  E.lctx.clearRect(0,0,W,H);
  const {x0, x1} = contPath();
  const cw = x1 - x0;
  E.colW = 6; E.cols = Math.max(8, Math.ceil(cw / E.colW));
  E.heights = new Float32Array(E.cols);
  // container area -> grain count so it fills exactly at duration end
  let area;
  if(E.cont==='orb'){ const r = Math.min(W,H)*E.sizeF/2; area = Math.PI*r*r; }
  else if(E.cont==='vessel'){ area = (W*E.sizeF)*(H*E.sizeF); }
  else area = W*H;
  E.total = Math.floor(area * 0.97 / (E.colW*E.colW));
  E.duration = S.minutes * 60000;
  document.getElementById('setup').classList.add('hide');
  document.getElementById('stage').classList.add('on');
  document.getElementById('timesup').classList.remove('on');
  E.running = true; E.last = performance.now();
  requestAnimationFrame(loop);
}
function releaseRate(){ return E.total / (E.duration/1000); }
function loop(now){
  if(!E.running) return;
  const dt = Math.min(0.05, (now - E.last)/1000);
  E.last = now;
  if(!E.paused && !E.done){
    E.elapsed += dt*1000;
    E.relAcc += releaseRate()*dt;
    let guard = 0;
    while(E.relAcc >= 1 && E.released < E.total && E.grains.length < 520 && guard++ < 80){
      E.relAcc -= 1; E.released++;
      E.grains.push(spawn());
    }
    const tsec = now/1000, {x0, x1} = contPath();
    for(let i=E.grains.length-1; i>=0; i--){
      const gr = E.grains[i];
      gr.vy += E.gy*dt; gr.vx += E.gx*dt;
      gr.vx *= (1 - 0.12*dt);
      gr.x += (gr.vx + Math.sin(tsec*2.2 + gr.ph)*10)*dt;
      gr.y += gr.vy*dt;
      gr.rot += gr.vr*dt;
      if(gr.x < x0+3){ gr.x = x0+3; gr.vx = Math.abs(gr.vx)*0.4; }
      if(gr.x > x1-3){ gr.x = x1-3; gr.vx = -Math.abs(gr.vx)*0.4; }
      const ci = Math.max(0, Math.min(E.cols-1, Math.floor(gr.x / W * E.cols)));
      if(gr.y >= H - E.heights[ci] - gr.size*0.25){ settle(gr); E.grains.splice(i,1); }
      else if(gr.y > H+40) E.grains.splice(i,1);
    }
    for(let i=E.dust.length-1; i>=0; i--){
      const d = E.dust[i]; d.age += dt;
      if(d.age >= d.life){ E.dust.splice(i,1); continue; }
      d.x += d.vx*dt; d.y += d.vy*dt; d.vy += 200*dt;
    }
    E.shakeX *= (1-6*dt); E.shakeY *= (1-6*dt);
    if(isFinite(E.duration) && E.elapsed >= E.duration) finishRun();
    else if(E.settledCount >= E.total) finishRun();
    drawClock(); drawProg();
  }
  render(now);
  requestAnimationFrame(loop);
}
function render(now){
  const tsec = now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // bg
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0e0d0a'); bg.addColorStop(1,'#060505');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(E.shakeX||E.shakeY) ctx.translate(E.shakeX*Math.random(), E.shakeY*Math.random());
  const cp = contPath();
  // vessel glass under sand
  if(E.cont!=='full'){
    ctx.fillStyle = 'rgba(255,255,255,.045)';
    ctx.fill(cp.path);
  }
  ctx.save();
  ctx.clip(cp.path);
  ctx.drawImage(E.layer, 0, 0, W, H);
  // falling grains + trails
  for(const gr of E.grains){
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = gr.size*0.5;
    ctx.beginPath();
    ctx.moveTo(gr.x - gr.vx*0.035, gr.y - gr.vy*0.035);
    ctx.lineTo(gr.x, gr.y);
    ctx.stroke();
    const g = ctx, r = gr.size/2;
    g.save(); g.translate(gr.x, gr.y); g.rotate(gr.rot);
    grainPath(g, gr.form, r); g.fillStyle = gr.shade; g.fill();
    g.restore();
  }
  for(const d of E.dust){
    const a = 1 - d.age/d.life;
    ctx.fillStyle = 'rgba(255,255,255,'+(a*0.5).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r*a+0.3, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  // vessel outline on top
  if(E.cont!=='full'){
    ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 2.5;
    ctx.stroke(cp.path);
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 8;
    ctx.stroke(cp.path);
  }
  ctx.restore();
  if(E.paused){
    ctx.fillStyle = 'rgba(8,7,6,.5)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = 'rgba(245,243,238,.92)'; ctx.textAlign = 'center';
    ctx.font = '400 16px "Noto Sans TC", sans-serif';
    ctx.fillText(t('paused'), W/2, H/2);
  }
}
function fmt(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  const p = n => String(n).padStart(2,'0');
  return h>0 ? h+':'+p(m)+':'+p(ss) : p(m)+':'+p(ss);
}
function drawClock(){ document.getElementById('clock').textContent = fmt(Math.max(0, E.duration - E.elapsed)); }
function drawProg(){
  const p = E.duration>0 ? Math.min(1, E.elapsed/E.duration) : 0;
  document.getElementById('pfill').style.width = (p*100).toFixed(1)+'%';
}
function finishRun(){
  if(E.done) return;
  E.done = true;
  setTimeout(()=>{
    E.running = false;
    document.getElementById('timesup').classList.add('on');
    chime();
  }, 700);
}
let AC = null;
function chime(){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>{
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + i*0.28;
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.4,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+1.8);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+1.9);
    });
  }catch(e){}
}
/* ================= controls ================= */
let toastT = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 1200);
}
document.getElementById('bPause').onclick = ()=>{
  if(E.done) return;
  E.paused = !E.paused;
  document.getElementById('bPause').classList.toggle('on', E.paused);
};
document.getElementById('bClose').onclick = ()=>{
  E.running = false; stopGyro();
  document.getElementById('stage').classList.remove('on');
  document.getElementById('setup').classList.remove('hide');
};
document.getElementById('bAgain').onclick = ()=>{ document.getElementById('timesup').classList.remove('on'); startRun(); };
document.getElementById('bColor').onclick = ()=>{
  S.color = (S.color+1) % PALETTES.length;
  E.pal = PALETTES[S.color];
  toast(t('toast_color')+' · '+t('cols')[E.pal.id]);
};
document.getElementById('bShape').onclick = ()=>{
  S.form = (S.form+1) % FORMS.length;
  E.form = FORMS[S.form];
  toast(t('toast_shape')+' · '+t('forms')[E.form]);
};
/* ================= gyro ================= */
let gyroOn = false;
async function toggleGyro(){
  const DOE = window.DeviceOrientationEvent;
  if(typeof DOE !== 'undefined' && typeof DOE.requestPermission === 'function'){
    try{ if(await DOE.requestPermission() !== 'granted'){ toast(t('gyro_na')); return; } }
    catch(e){ toast(t('gyro_na')); return; }
  }
  gyroOn = !gyroOn;
  document.getElementById('bGyro').classList.toggle('on', gyroOn);
  if(gyroOn){
    window.addEventListener('deviceorientation', onTilt);
    window.addEventListener('devicemotion', onShake);
    toast(t('gyro_on'));
  } else stopGyro();
}
function stopGyro(){
  if(!gyroOn) return;
  gyroOn = false;
  document.getElementById('bGyro').classList.remove('on');
  window.removeEventListener('deviceorientation', onTilt);
  window.removeEventListener('devicemotion', onShake);
  E.gx = 0; E.gy = GRAV;
  toast(t('gyro_off'));
}
function onTilt(e){
  if(!gyroOn) return;
  const g = e.gamma || 0;
  E.gx = Math.max(-1, Math.min(1, g/40)) * GRAV * 0.55;
}
function onShake(e){
  if(!gyroOn) return;
  const a = e.accelerationIncludingGravity;
  if(!a) return;
  const mag = Math.hypot(a.x||0, a.y||0, a.z||0);
  if(mag > 21){
    for(const gr of E.grains){
      gr.vx += (Math.random()-0.5)*560;
      gr.vy -= Math.random()*300;
    }
    E.shakeX = 7; E.shakeY = 7;
  }
}
document.getElementById('bGyro').onclick = toggleGyro;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && E.running && !E.paused && !E.done){
    E.paused = true; document.getElementById('bPause').classList.add('on');
  }
});
window.addEventListener('resize', ()=>{ if(E.running) sizeCanvas(); });

/* ================= boot ================= */
applyTheme();
applyLang();
</script>
